<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>House Rent Prediction System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>House Rent Prediction System</h1>
      <p class="subtitle">Accurate market rental estimation and deposit calculator</p>
    </header>

    <div class="grid">
      <div class="card">
        <h2>Property Specifications</h2>
        <div class="form-group">
          <label>BHK Count</label>
          <select id="bhk">
            <option value="1">1 BHK</option>
            <option value="2" selected>2 BHK</option>
            <option value="3">3 BHK</option>
            <option value="4">4 BHK</option>
          </select>
        </div>
        <div class="form-group">
          <label>Total Area (sq. ft.)</label>
          <input type="number" id="area" value="1050" min="200" step="50">
        </div>
        <div class="form-group">
          <label>City Zone</label>
          <select id="zone">
            <option value="Downtown">Downtown / Central</option>
            <option value="Tech Corridor" selected>Tech Corridor</option>
            <option value="Suburb">Suburb</option>
            <option value="Rural">Rural / Outskirts</option>
          </select>
        </div>
        <div class="form-group">
          <label>Furnishing Status</label>
          <select id="furnishing">
            <option value="Furnished">Fully Furnished</option>
            <option value="Semi-Furnished" selected>Semi-Furnished</option>
            <option value="Unfurnished">Unfurnished</option>
          </select>
        </div>
        <div class="form-group">
          <label>Floor Number</label>
          <input type="number" id="floor" value="4" min="0" max="50">
        </div>
        <button id="calcBtn">Estimate Rental Quote</button>
      </div>

      <div class="card">
        <h2>Valuation Summary</h2>
        <div id="statusContainer">
          <span class="status-badge badge-info" id="zoneBadge">Verified Listing Model</span>
        </div>
        <div class="result-box">
          <div class="metric-row">
            <span class="metric-name">Estimated Rent</span>
            <span class="metric-value" id="resRent">--</span>
          </div>
          <div class="metric-row">
            <span class="metric-name">Recommended Security Deposit</span>
            <span class="metric-value" id="resDeposit">--</span>
          </div>
          <div class="metric-row">
            <span class="metric-name">Zone Classification</span>
            <span class="metric-value" id="resZone">--</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
